<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Колесо призов</title><link rel="stylesheet" href="../shared/ui.css"><style>html,body{background:transparent!important}body{color:#edf0e4;padding:8px 12px 12px;font-family:system-ui,sans-serif}.overlay-head{display:flex;justify-content:space-between;align-items:center;padding:0 5px 8px;position:sticky;top:0;z-index:6}.details-open .overlay-head{background:#26352c;border-radius:12px}.overlay-head span{font-size:13px;color:#edf0e4}.overlay-head span:empty{visibility:hidden}.overlay-head button{color:#edf0e4;background:#202a24d9;border:1px solid #c8ccad33;border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;line-height:1;flex-shrink:0}#extras{background:#26352cf5;border:1px solid #c8ccad33;border-radius:16px;padding:12px;margin:8px}#extras[hidden]{display:none}.tools{display:flex;gap:6px;flex-wrap:wrap;padding:12px 0}.tools button{font-size:11px;padding:6px 9px;background:#344439;color:#edf0e4;border-color:#ffffff22}.tools button[aria-pressed=true]{border-color:#e1ce9b}.demo-foot,.sub{color:#bec8b8}.history{padding:0}.history-item{border-color:#ffffff22;flex-wrap:wrap;overflow-wrap:anywhere}.history-item>div{min-width:0}.tools{max-width:100%}body{overflow-x:hidden}.extra-title{font-size:12px;font-weight:500}.demo-foot{font-size:10px}</style></head><body><header class="overlay-head"><span id="view-title"></span><button id="close" aria-label="Close wheel"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></header><main><div id="host"></div><section id="extras" hidden><details><summary class="extra-title">Оформление и демо-баланс</summary><div class="tools" aria-label="Оформление"><button data-theme="night" aria-pressed="true">Лес</button><button data-theme="mint" aria-pressed="false">Мята</button><button data-theme="violet" aria-pressed="false">Фиолетовый</button><button id="topup">＋ Демо-токены</button></div></details><p id="message" role="status" class="sub"></p><details class="history"><summary class="extra-title">История вращений</summary><div id="history"></div></details><p class="demo-foot">Локальное демо · без реальных платежей и денежных призов.<br>Seed хранится в браузере. Проверка демонстрирует алгоритм.</p></section></main><script type="module" src="player.js"></script></body></html>
